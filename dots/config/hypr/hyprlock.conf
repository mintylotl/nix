background {
    monitor =
    path = /home/jwm/.config/bg/stars.png   # supports png, jpg, webp (no animations, though)
    color = rgba(0, 0, 0, 1.0)

    blur_passes = 0 # 0 disables blurring
    blur_size = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    immediate_render = true
    grace = 5
    no_fade_in = true
    no_fade_out = true
    ignore_empty_input = true
}
